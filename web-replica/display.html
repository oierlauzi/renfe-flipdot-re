<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:550},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SIN PARADA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;minutes&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;showMinutes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;dotColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e2d14a&quot;,&quot;options&quot;:[&quot;#e2d14a&quot;,&quot;#d9e04a&quot;,&quot;#e8a53a&quot;,&quot;#eae4d2&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;showOffDots&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;deadOnPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;deadOffPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;deadSeed&quot;:{&quot;editor&quot;:&quot;number&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Flip-dot row&quot;},&quot;ledText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PROHIBIDO CRUZAR LAS VIAS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;LED matrix&quot;},&quot;ledColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff3b2e&quot;,&quot;options&quot;:[&quot;#ff3b2e&quot;,&quot;#ff6a1a&quot;,&quot;#ff2b55&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;LED matrix&quot;},&quot;ledScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;LED matrix&quot;},&quot;ledSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:14,&quot;min&quot;:2,&quot;max&quot;:30,&quot;step&quot;:1,&quot;unit&quot;:&quot;col/s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;LED matrix&quot;},&quot;platform&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sign&quot;}}">
const CP437 = {};
for (const b in CP437_TO_UNICODE) CP437[CP437_TO_UNICODE[b]] = Number(b);
// CP437 has no capital Á Í Ó Ú À È Ì Ò Ù — fall back to the unaccented capital
Object.assign(CP437, {'Á':0x41,'Í':0x49,'Ó':0x4F,'Ú':0x55,'À':0x41,'È':0x45,'Ì':0x49,'Ò':0x4F,'Ù':0x55});

// --- Edit these when using the file standalone, or drive it via URL params: ---
// ?text=...&min=...&via=...&led=...&showmin=0|1&dot=RRGGBB&showoff=0|1&ledc=RRGGBB&scroll=0|1&speed=N
// &deadon=N&deadoff=N&deadseed=N
const DEFAULT_TEXT = 'SIN PARADA';   // up to 16 characters
const DEFAULT_MINUTES = '1';         // shown right-aligned in the same row; '' for none
const DEFAULT_PLATFORM = '1';
const DEFAULT_LED_TEXT = 'PROHIBIDO CRUZAR LAS VIAS';
const LED_GAP_COLS = 24;             // blank columns between the end and the restart of the loop
const DEFAULT_DEAD_ON_PCT = 0;       // % of flip-dots stuck spuriously lit
const DEFAULT_DEAD_OFF_PCT = 0;      // % of flip-dots stuck dark
const DEFAULT_DEAD_SEED = 1;         // which dots are stuck is derived from this, not re-rolled each render
const Q = typeof location !== 'undefined' ? new URLSearchParams(location.search) : new Map();
const qBool = (name, dflt) => Q.has(name) ? Q.get(name) !== '0' && Q.get(name) !== 'false' : dflt;
const qNum = (name, dflt) => Q.has(name) ? Number(Q.get(name)) : dflt;
const qColor = (name, dflt) => Q.has(name) ? '#' + Q.get(name).replace(/^#/, '') : dflt;

// Deterministic pseudo-random in [0,1) for a given dot, so the stuck-pixel
// pattern stays put across re-renders (LED scroll ticks) instead of flickering.
function hash01(seed, x, y, z) {
  let h = Math.imul(seed ^ 0x9e3779b9, 2654435761) >>> 0;
  h = Math.imul(h ^ x, 2246822519) >>> 0;
  h = Math.imul(h ^ y, 3266489917) >>> 0;
  h = Math.imul(h ^ z, 668265263) >>> 0;
  h ^= h >>> 15;
  h = Math.imul(h, 2246822519) >>> 0;
  h ^= h >>> 13;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Flip-dot character grid: geometry lifted from the _character00.._character15
// placeholder rects in display.svg (equal size, equal spacing, equal y).
const COLS = 5, ROWS = 7, CELLS = 16;
const ROW_X = 24.658236, ROW_Y = 39.877911;
const CELL_W = 7.9834499, GAP = 1.4552071;
const PITCH = CELL_W / COLS, DOT = PITCH * 4.3 / 11;
const CELL_MARGIN = (PITCH - DOT * 2); // half the free space between two dots, used as the outline's margin
const MIN_CELLS = 0;

// LED matrix: geometry lifted from the _led placeholder rect in display.svg.
const LED_X = 20.358263, LED_Y = 60.55167, LED_W = 158.50243, LED_H = 11.181376, LED_ROWS = 7;
const LED_PITCH = LED_H * 12 / 95; // same row-height fraction the old 12/95px design used

// 5x7 flip-dot glyphs (from font-map.txt): code page byte -> 5 column bytes, bit0 = top row
const GLYPHS = {0:"0000000000",1:"7f4551457f",2:"7f6b4f6b7f",3:"0e1f7c1f0e",4:"0c1e3f1e0c",5:"0c1e7f1e0c",6:"1c3e5f3e1c",7:"0000080000",8:"7f7f777f7f",9:"1c2222221c",10:"635d5d5d63",11:"38283a060e",12:"0629792906",13:"60603f0304",14:"101f457e00",15:"2a1c361c2a",16:"3e1c1c0808",17:"08081c1c3e",18:"14227f2214",19:"005f005f00",20:"067f017f01",21:"025d555d20",22:"1c1c1c1c1c",23:"404a5f4a40",24:"04027f0204",25:"10207f2010",26:"08082a1c08",27:"081c2a0808",28:"0e08080808",29:"081c081c08",30:"181c1f1c18",31:"0c1c7c1c0c",32:"0000000000",33:"00005f0000",34:"0007000700",35:"7f7f7f7f7f",36:"7c09050578",37:"7c0911217c",38:"3649562050",39:"0000070000",40:"1c22410000",41:"000041221c",42:"22147f1422",43:"08083e0808",44:"0040300000",45:"0808080808",46:"0000400000",47:"2010080402",48:"3e4141413e",49:"00427f4000",50:"6251494946",51:"2241494936",52:"1814127f10",53:"2745454539",54:"3c4a494930",55:"0171090503",56:"3649494936",57:"064949291e",58:"0000140000",59:"0040340000",60:"0814224100",61:"1414141414",62:"0041221408",63:"0201590502",64:"3e415d594e",65:"7e0909097e",66:"7f49494936",67:"3e41414122",68:"7f4141413e",69:"7f49494941",70:"7f09090901",71:"3e41494978",72:"7f0808087f",73:"00417f4100",74:"204040403f",75:"7f08142241",76:"7f40404040",77:"7f020c027f",78:"7f0408107f",79:"3e4141413e",80:"7f09090906",81:"3e4151215e",82:"7f09192946",83:"4649494931",84:"01017f0101",85:"3f4040403f",86:"0f3040300f",87:"7f2018207f",88:"6314081463",89:"0304780403",90:"6151494543",91:"7f7f414141",92:"0204081020",93:"4141417f7f",94:"1008040810",95:"4040404040",96:"0001020400",97:"2054545478",98:"7f48444438",99:"3844444444",100:"384444487f",101:"3854545408",102:"00087e0902",103:"485454543c",104:"7f08040478",105:"00007d0000",106:"2040403d00",107:"7f10284400",108:"003f402000",109:"7c0438047c",110:"7c08040478",111:"3844444438",112:"7c14141408",113:"081414147c",114:"7c08040408",115:"4854545424",116:"043f442400",117:"3c4040403c",118:"0c3040300c",119:"3c4030403c",120:"4428102844",121:"0448300804",122:"4464544c44",123:"0836414100",124:"00007f0000",125:"0041413608",126:"0201020402",127:"1814121418",128:"0e5151310a",129:"3d40403d40",130:"007c565d00",131:"2255553a40",132:"2154543940",133:"2055563840",134:"2054553840",135:"0e5151310a",136:"3a55551a00",137:"3855541900",138:"3855561800",139:"00457c4100",140:"004a794200",141:"00497a4000",142:"7924222479",143:"702a252a70",144:"7c54564500",145:"3454385458",146:"7c0a7f4949",147:"3249493200",148:"3944443900",149:"3845463800",150:"3a41413a40",151:"3841423840",152:"4429100904",153:"3944444439",154:"3d4040403d",155:"18247e2400",156:"487e494142",157:"2b2c782c2b",158:"7f05157a50",159:"487e090102",160:"2054563940",161:"00487a4100",162:"3844463900",163:"3c40423d40",164:"7a090a7100",165:"7a09112279",166:"4855554f50",167:"4e51514e00",168:"3048454020",169:"3808080808",170:"0808080818",171:"17084c6a59",172:"1728347a21",173:"0000790000",174:"08142a1422",175:"22142a1408",176:"5500550055",177:"552a552a55",178:"2a552a552a",179:"00007f0000",180:"08087f0000",181:"14147f0000",182:"087f007f00",183:"0878087800",184:"14147c0000",185:"1477007f00",186:"007f007f00",187:"1474047c00",188:"1417101f00",189:"080f080f00",190:"141f000000",191:"0808780000",192:"00000f0808",193:"08080f0808",194:"0808780808",195:"00007f0808",196:"0808080808",197:"08087f0808",198:"00007f1414",199:"007f007f08",200:"001f101714",201:"007c047414",202:"1417101714",203:"1474047414",204:"007f007714",205:"1414141414",206:"1477007714",207:"1414171414",208:"080f080f08",209:"1414741414",210:"0878087808",211:"000f080f08",212:"00001f1414",213:"00007c1414",214:"0078087808",215:"087f087f08",216:"14147f1414",217:"08080f0000",218:"0000780808",219:"7f7f7f7f7f",220:"7878787878",221:"7f7f7f0000",222:"00007f7f7f",223:"0f0f0f0f0f",224:"3844443844",225:"7e01251a00",226:"7e02020600",227:"047c047c04",228:"4163554963",229:"3844443c04",230:"403e101e10",231:"0804780404",232:"005d775d00",233:"1c2a492a1c",234:"5c6202625c",235:"304a4d3902",236:"1824182418",237:"5c322a261d",238:"1c2a494900",239:"7c0202027c",240:"2a2a2a2a2a",241:"44445f4444",242:"00514a4400",243:"00444a5100",244:"00007c020c",245:"18201f0000",246:"086b6b0800",247:"2412241224",248:"0609090600",249:"000c0c0000",250:"0008080000",251:"0818203f01",252:"001f013e00",253:"3229260000",254:"003c3c3c00",255:"0000000000"};

class Component extends DCLogic {
  state = { ledOff: 0, rev: 0 };

  componentDidMount() {
    this.timer = setInterval(() => {
      if (!qBool('scroll', this.props.ledScroll ?? true)) return;
      this.setState(s => ({ ledOff: s.ledOff + 1 }));
    }, 1000 / qNum('speed', this.props.ledSpeed ?? 14));

    // A parent frame may push new values in rather than reloading this page,
    // which is what display-realtime.html does: reassigning src would restart
    // the LED marquee on every refresh. Same-origin only — display-realtime.html
    // sits beside this file, whereas a third-party page embedding it does not,
    // and must not be able to rewrite the sign.
    this.onMessage = (event) => {
      if (event.origin !== location.origin) return;
      const data = event.data;
      if (!data || data.type !== 'flipdot-params' || typeof data.params !== 'object') return;
      // A new announcement should be read from the beginning, so restart the
      // marquee when the LED text itself changes but not on a countdown tick.
      const ledChanged = 'led' in data.params && String(data.params.led) !== (Q.get('led') ?? '');
      for (const key of Object.keys(data.params)) Q.set(key, String(data.params[key]));
      this.setState(s => ({ rev: s.rev + 1, ledOff: ledChanged ? 0 : s.ledOff }));
    };
    window.addEventListener('message', this.onMessage);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    window.removeEventListener('message', this.onMessage);
  }

  code(ch) {
    if (CP437[ch] !== undefined) return CP437[ch];
    const c = ch.charCodeAt(0);
    return c < 256 ? c : 0x20;
  }

  row() {
    const src = Q.get('text') ?? this.props.text ?? DEFAULT_TEXT;
    const cells = String(src).slice(0, CELLS).split('');
    while (cells.length < CELLS) cells.push(' ');
    if (qBool('showmin', this.props.showMinutes ?? true)) {
      const end = CELLS - MIN_CELLS;
      const m = String(Q.get('min') ?? this.props.minutes ?? DEFAULT_MINUTES).slice(-end);
      for (let i = 0; i < m.length; i++) cells[end - m.length + i] = m[i];
    }
    return cells;
  }

  flipDots() {
    const glyphs = GLYPHS;
    const lit = qColor('dot', this.props.dotColor || '#e2d14a');
    const off = qBool('showoff', this.props.showOffDots !== false) ? '#26261e' : null;
    const deadOnFrac = qNum('deadon', this.props.deadOnPct ?? DEFAULT_DEAD_ON_PCT) / 100;
    const deadOffFrac = qNum('deadoff', this.props.deadOffPct ?? DEFAULT_DEAD_OFF_PCT) / 100;
    const deadSeed = qNum('deadseed', this.props.deadSeed ?? DEFAULT_DEAD_SEED);
    const cells = this.row();
    const kids = [];
    for (let i = 0; i < CELLS; i++) {
      const hex = glyphs ? glyphs[this.code(cells[i] || ' ')] : null;
      const x0 = i * (CELL_W + GAP);
      kids.push(React.createElement('rect', {
        key: i + '_outline',
        x: x0 - CELL_MARGIN, y: -CELL_MARGIN,
        width: CELL_W + CELL_MARGIN * 2, height: ROWS * PITCH + CELL_MARGIN * 2,
        fill: '#292929', stroke: '#000000', strokeWidth: 0.2
      }));
      for (let c = 0; c < COLS; c++) {
        const byte = hex ? parseInt(hex.slice(c * 2, c * 2 + 2), 16) : 0;
        for (let r = 0; r < ROWS; r++) {
          const on = (byte >> r) & 1;
          let stuck = on;
          if (deadOnFrac > 0 || deadOffFrac > 0) {
            const rnd = hash01(deadSeed, i, c, r);
            if (rnd < deadOnFrac) stuck = 1;
            else if (rnd < deadOnFrac + deadOffFrac) stuck = 0;
          }
          if (!stuck && !off) continue;
          const x = x0 + c * PITCH + PITCH / 2 - DOT;
          const y = r * PITCH + PITCH / 2 - DOT;
          const s = DOT * 2, k = DOT * 0.5;
          const key = i + '_' + c + '_' + r;
          kids.push(React.createElement('polygon', {
            key: key,
            points: [
              (x + k) + ',' + y, (x + s - k) + ',' + y,
              (x + s) + ',' + (y + k), (x + s) + ',' + (y + s - k),
              (x + s - k) + ',' + (y + s), (x + k) + ',' + (y + s),
              x + ',' + (y + s - k), x + ',' + (y + k)
            ].join(' '),
            fill: stuck ? lit : off
          }));
          const fold = DOT * 0.4 / 4.3; // fold-line inset, kept proportional to the dot size
          kids.push(React.createElement('line', {
            key: key + 'a',
            x1: x + fold, y1: y + s - fold, x2: x + s - fold, y2: y + fold,
            stroke: stuck ? 'rgba(0,0,0,0.32)' : 'rgba(255,255,255,0.07)',
            strokeWidth: DOT * 0.7 / 4.3
          }));
        }
      }
    }
    return React.createElement('g', { transform: 'translate(' + ROW_X + ',' + ROW_Y + ')' }, kids);
  }

  bitmap(text) {
    const cols = [];
    for (const ch of String(text)) {
      const hex = GLYPHS[this.code(ch)];
      for (let c = 0; c < COLS; c++) cols.push(hex ? parseInt(hex.slice(c * 2, c * 2 + 2), 16) : 0);
      cols.push(0);
    }
    return cols;
  }

  ledDots() {
    const w = LED_W, h = LED_H, pitch = LED_PITCH, rows = LED_ROWS;
    const cols = Math.floor((w - pitch) / pitch);
    const gw = cols * pitch, gh = rows * pitch;
    const x0 = (w - gw) / 2, y0 = (h - gh) / 2;
    const lit = qColor('ledc', this.props.ledColor || '#ff3b2e');
    const bmp = this.bitmap(Q.get('led') ?? this.props.ledText ?? DEFAULT_LED_TEXT);
    const scrolling = bmp.length > cols;
    const total = bmp.length + LED_GAP_COLS;
    const off = scrolling ? this.state.ledOff % total : 0;
    const pad = scrolling ? 0 : Math.floor((cols - bmp.length) / 2);
    const kids = [React.createElement('rect', { key: 'bg', x: 0, y: 0, width: w, height: h, fill: '#2c0a11', stroke: '#000000', strokeWidth: 0.2 })];
    for (let c = 0; c < cols; c++) {
      const byte = scrolling ? (bmp[(off + c) % total] || 0) : (bmp[c - pad] || 0);
      for (let r = 0; r < rows; r++) {
        const on = (byte >> r) & 1;
        kids.push(React.createElement('circle', {
          key: r + '_' + c,
          cx: x0 + c * pitch + pitch / 2,
          cy: y0 + r * pitch + pitch / 2,
          r: on ? pitch * 3.1 / 12 : pitch * 2.3 / 12,
          fill: on ? lit : '#40101a'
        }));
      }
    }
    return React.createElement('g', { transform: 'translate(' + LED_X + ',' + LED_Y + ')' }, kids);
  }

  platform() {
    const val = Q.get('via') ?? this.props.platform ?? DEFAULT_PLATFORM;
    return React.createElement(React.Fragment, null, String(val));
  }

  renderVals() {
    return {
      platform: this.platform(),
      dotColor: qColor('dot', this.props.dotColor || '#e2d14a'),
      flipDots: this.flipDots(),
      ledDots: this.ledDots()
    };
  }
}

</script>
</body>
</html>
